    <title>MTM Internal Site</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; color: #000; background: #f9fafb; font-family: Roboto, Arial, sans-serif; }
      main { width: 100%; max-width: 560px; }
      h1 { margin: 0 0 32px; font: 400 32px/1.1 Georgia, serif; letter-spacing: -1px; }
      h2 { margin: 0 0 12px; color: #707070; font-size: 13px; font-weight: 500; letter-spacing: .3px; text-transform: uppercase; }
      .links { display: flex; flex-wrap: wrap; gap: 8px; }
      a { padding: 12px 20px; border: 1px solid #000; border-radius: 8px; color: #fff; background: #000; font-size: 14px; text-decoration: none; }
      a:hover, a:focus-visible { background: #202020; }
    </style>
  </head>

    <main>
      <h1>MTM Internal Site</h1>
      <section aria-labelledby="reports-heading">
        <h2 id="reports-heading">Reports</h2>
        <div class="links">
